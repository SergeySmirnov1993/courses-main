events {
    worker_connections 1024;
}

http {
    upstream django {
        server web:8000;
    }

    # Редирект HTTP → HTTPS (раскомментировать при наличии SSL)
    # server {
    #     listen 80;
    #     server_name yourdomain.com www.yourdomain.com;
    #     return 301 https://$server_name$request_uri;
    # }

    # HTTP (пока без SSL)
    # Для Certbot webroot: /.well-known/acme-challenge/
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS (раскомментировать когда есть домен и сертификаты от Certbot)
    # 1. Запустить certbot для получения сертификата
    # 2. Раскомментировать блок ниже
