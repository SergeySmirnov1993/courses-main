{% extends "base.html" %}

{% block title %}{% if is_edit %}Редактировать часть курса{% else %}Создать часть курса{% endif %}{% endblock %}

{% block content %}
    <h1>{% if is_edit %}Редактировать часть курса{% else %}Создать часть курса{% endif %}</h1>
    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="btn-group">
                <button type="submit" class="btn btn--primary">Сохранить</button>
                <a href="{% url 'course-details' course_id %}" class="btn btn--secondary">Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
