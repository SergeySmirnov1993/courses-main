{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Update Course{% else %}Create Course{% endif %}{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Редактировать курс{% else %}Создать курс{% endif %}</h1>
    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="btn-group">
                <button type="submit" class="btn btn--primary">Сохранить</button>
                <a href="{% url 'courses' %}" class="btn btn--secondary">Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
